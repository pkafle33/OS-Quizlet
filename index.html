      {q:"What is the Storage-Device Hierarchy?", a:"From fastest/most expensive to slowest/cheapest: CPU Registers → L1 Cache → L2 Cache → L3 Cache → Main Memory (RAM) → SSD → HDD → Optical → Magnetic Tape. The principle: data moves up to faster levels when needed, and higher levels are smaller. This hierarchy exists because fast memory is expensive."},
      {q:"What is an Interrupt? What types exist?", a:"A signal that causes the CPU to stop its current task and transfer control to an Interrupt Service Routine (ISR). Types: Hardware interrupt (device signals completion — e.g., keyboard press), Software interrupt / Trap (program requests OS service via system call, or an error occurs). The interrupt vector table stores addresses of all ISRs."},
      {q:"What is a Process?", a:"A program in execution. Contains: Text section (code), Data section (global variables), Heap (dynamic memory, grows upward), Stack (function calls, local variables, grows downward), Program Counter, and CPU registers. A program is passive (on disk); a process is active (in execution)."},
      {q:"What is Protection vs Security?", a:"Protection: controlling access to resources among processes and users within the system (internal). Security: defending the system against external and internal attacks (e.g., viruses, unauthorized access). Protection mechanisms (like memory boundaries) support security goals."},
      {q:"What is Multi-Level Caching?", a:"Multiple cache levels between CPU and RAM. L1: on-chip, ~4KB–64KB, ~1ns access. L2: on-chip or near-chip, ~256KB–1MB. L3: shared across cores, ~8MB+. On a memory access, hardware checks L1 first, then L2, L3, then RAM. Cache hit = fast; cache miss = go to next level. Temporal and spatial locality make caches effective."},
      {q:"What is a Dual-Core vs Multi-Core Design?", a:"Dual-core: 2 processing cores on one chip, sharing L3 cache and memory bus. Multi-core: 2+ cores. Each core has its own L1/L2 cache. Enables true parallel execution. OS must manage scheduling across cores and handle cache coherence (cores seeing consistent data)."},
      {q:"What is a Clustered System?", a:"Multiple computers (nodes) connected via LAN, working together. Provides high availability and HPC. Asymmetric clustering: one standby node monitors the active one (hot standby). Symmetric clustering: all nodes run applications and monitor each other. Failover: if one node fails, another takes over its workload."},
      {q:"What is the difference between Multiprogramming and Multitasking?", a:"Multiprogramming: multiple jobs kept in memory simultaneously; when one waits for I/O, CPU runs another. Goal: maximize CPU utilization. Multitasking (time-sharing): CPU switches rapidly among processes (time slices), giving illusion of simultaneous execution. Provides interactive response time."},
      {q:"What is the difference between a process and a program?", a:"A program is a passive entity — a file stored on disk containing instructions. A process is an active entity — a program loaded into memory and executing. One program can spawn multiple processes (e.g., opening Chrome twice creates two processes). A process has resources allocated by the OS; a program does not."},

      {q:"What services does an OS provide?", a:"User-facing: program execution, I/O operations, file system manipulation, communications, error detection. System-efficiency: resource allocation (CPU, memory, I/O), logging/accounting, protection (control access), security (defend against attacks)."},
      {q:"What is Policy vs Mechanism? Why separate them?", a:"Mechanism: HOW something is done (e.g., timer-based CPU preemption). Policy: WHAT should be done / decisions made (e.g., how long each process's quantum should be). Separation allows flexibility: you can change policy (e.g., longer quanta for interactive processes) without changing the underlying mechanism (the timer hardware)."},
      {q:"What is User Mode vs Kernel Mode?", a:"Dual-mode operation protects OS from user errors. Mode bit: 0 = kernel mode (full hardware access, privileged instructions allowed), 1 = user mode (restricted). User programs run in user mode. To request OS services, a program executes a system call (trap), which switches to kernel mode. After OS completes the service, it returns to user mode."},
      {q:"What is a System Call? Give examples.", a:"A system call is a programmatic way a user program requests a service from the OS kernel. Categories: Process control (fork, exec, exit, wait), File management (open, read, write, close), Device management (ioctl), Information maintenance (getpid, time), Communications (pipe, socket, send, recv). Each call has a number; a system call interface looks up the number in a table."},
      {q:"What are Windows vs Unix system calls?", a:"Unix/POSIX: fork() (create process), exec() (replace process image), open()/read()/write()/close() (file I/O), wait() (wait for child). Windows: CreateProcess(), CreateFile(), ReadFile()/WriteFile(), WaitForSingleObject(). Windows calls are generally more complex with more parameters."},
      {q:"What is OS Implementation and Emulation?", a:"Implementation: OS written mostly in high-level language (C/C++) for portability. Small assembly portions for hardware-specific code (interrupt handlers, context switching). Emulation: running an OS designed for different hardware on another architecture via software translation. Virtual machines emulate an entire computer."},
      {q:"What is Policy and Mechanism separation? Give a real example.", a:"Example: CPU scheduling. Mechanism: the hardware timer that fires an interrupt every N milliseconds (HOW preemption works). Policy: should we use Round Robin, Priority Scheduling, or MLFQ (WHAT process runs next). You could swap RR for priority scheduling without changing the timer mechanism at all."},
      {q:"What is a Monolithic Kernel vs Microkernel?", a:"Monolithic: entire OS runs in kernel space (one large executable). Fast but complex and less reliable (bug anywhere can crash OS). Linux, Unix. Microkernel: minimal kernel (IPC, memory, scheduling); other services (file system, device drivers) run in user space. More reliable, easier to extend, but slower due to IPC overhead. Mach, QNX."},

    id:3, title:"Chapter 3", subtitle:"Processes", color:"#26de81",
    topics:[
      {q:"How is a Process laid out in Memory?", a:"Low to high addresses: Text (read-only code) → Data (initialized globals, BSS for uninitialized) → Heap (grows upward via malloc/new) → ... gap ... → Stack (grows downward, function frames, local vars, return addresses). Text and data are fixed size; heap and stack are dynamic and can collide if no limit."},
      {q:"What are Process States? Draw the diagram.", a:"New → Ready → Running → Waiting → Terminated. New: being created (loaded into memory). Ready: in memory, waiting for CPU time. Running: currently executing on CPU. Waiting: blocked waiting for I/O or event. Terminated: finished, resources being reclaimed. Transitions: admitted (new→ready), scheduler dispatch (ready→running), I/O request (running→waiting), I/O complete (waiting→ready), exit (running→terminated), interrupt (running→ready)."},
      {q:"What is a Long-term vs Short-term Scheduler?", a:"Long-term (job) scheduler: selects which processes from the job pool (disk) to load into memory. Controls degree of multiprogramming. Runs infrequently (seconds/minutes). Short-term (CPU) scheduler: selects which ready process to run next. Runs very frequently (milliseconds). Medium-term: swaps processes in/out of memory to control load."},
      {q:"What is a Context Switch?", a:"Saving the complete state (context) of the running process into its PCB, and loading the saved state of the next process to run. State includes: CPU registers, program counter, stack pointer, memory maps, I/O status. It is pure overhead — no useful work done. Time: ~microseconds. Minimizing context switches improves performance."},
      {q:"What is a Process Control Block (PCB)?", a:"OS data structure holding all info about a process. Contains: Process state, Process ID (PID), Program counter, CPU registers, CPU scheduling info (priority, queue pointers), Memory management info (page tables, base/limit registers), I/O status (open files, devices), Accounting info (CPU time used). One PCB per process."},
      {q:"What is the Degree of Multiprogramming?", a:"The number of processes simultaneously resident in main memory. Higher degree = better CPU utilization (less idle time waiting for I/O). Controlled by the long-term scheduler. Trade-off: too many processes → each gets too little memory → thrashing. Must balance utilization with available memory."},
      {q:"What is a Tree of Processes in Linux?", a:"Processes form a tree via parent-child relationships. Init (PID 1) is the root. fork() creates a child (copy of parent). Every process (except init) has a parent. pstree command shows this. Process groups and sessions build on this tree for signal delivery and terminal management."},
      {q:"What is Process Creation? What does fork() do?", a:"fork(): creates a child process that is an exact copy of the parent (same code, data, heap, stack, open files). Returns 0 to child, child's PID to parent. exec(): replaces the process's memory with a new program. Shell uses fork()+exec() pattern: fork a child, child calls exec() to run the command, parent waits with wait()."},
      {q:"What is an Orphan vs Zombie Process?", a:"Zombie: process has finished (exit() called) but parent hasn't called wait() yet. Entry remains in process table. Too many zombies waste process table entries. Orphan: process whose parent has terminated. Init (PID 1) adopts orphans and periodically calls wait() for them, preventing orphan zombies."},
      {q:"What is Interprocess Communication (IPC)? Two models?", a:"Mechanisms allowing processes to communicate and synchronize. Two models: Shared Memory — processes share a region of memory (fast, but need synchronization). Message Passing — processes communicate via send()/receive() system calls (easier to implement in distributed systems, no shared memory needed, slower due to kernel involvement)."},
      {q:"What is the Producer-Consumer Problem?", a:"Bounded buffer: producer generates items, consumer consumes them, shared buffer of size N. Problem: producer must wait if buffer full; consumer must wait if buffer empty. Race condition if no synchronization. Solution with semaphores: mutex (binary, protects buffer access), full (counting, tracks filled slots, init 0), empty (counting, tracks empty slots, init N)."},
      {q:"What is Message Passing? Synchronization options?", a:"Processes use send(P, msg) and receive(Q, msg). Can be blocking (synchronous): sender blocks until receiver gets message; receiver blocks until message available. Non-blocking (asynchronous): sender sends and continues; receiver gets message or null. A rendezvous occurs when both send and receive are blocking."},
      {q:"What are Pipes? Ordinary vs Named?", a:"Ordinary (anonymous) pipe: created with pipe() syscall, unidirectional (use 2 pipes for bidirectional), only between related processes (parent-child), disappears when both ends close. Named pipe (FIFO): created with mkfifo(), appears as file in filesystem, any two processes can use it, bidirectional on some OS, persists until explicitly deleted."},
      {q:"What are Direct vs Indirect Communication?", a:"Direct: processes name each other explicitly — send(P, msg), receive(Q, msg). One link per pair. Indirect: messages sent to/received from mailboxes (ports) — send(mailbox_A, msg). Multiple processes can share a mailbox. More flexible; OS manages mailboxes."},
    ],

    id:4, title:"Chapter 4", subtitle:"Threads", color:"#45aaf2",
    topics:[
      {q:"Why do Threads exist? What problem do they solve?", a:"Creating a new process is expensive (copy address space, PCB, etc.). Threads allow a single process to do multiple things concurrently while sharing the same address space. Benefits: Responsiveness (UI thread + worker thread), Resource sharing (share code/data without IPC), Economy (10-100x cheaper than process creation), Scalability (run truly parallel on multi-core CPUs)."},
      {q:"What do Threads Share vs Own?", a:"Shared (per process): code (text), global data, heap, open file descriptors, signals, environment variables. Per-thread (own): stack, registers, program counter, thread ID, errno. Because threads share heap and globals, they need synchronization when accessing shared data."},
      {q:"What is Concurrency vs Parallelism?", a:"Concurrency: multiple tasks making progress — can happen on a single core via time-slicing (interleaving). Parallelism: multiple tasks literally running simultaneously — requires multiple hardware execution units. Data parallelism: same operation on different data subsets. Task parallelism: different operations run simultaneously. Parallelism ⊂ Concurrency."},
      {q:"What are User-Level Threads vs Kernel Threads?", a:"User-level threads: managed entirely by user-space library (e.g., POSIX Pthreads with user implementation). Fast to create/switch. But: if one thread blocks on I/O, entire process blocks (kernel sees one thread). Kernel threads: OS knows about each thread, schedules them independently. If one blocks, others run. Slower creation. Linux/Windows use kernel threads."},
      {q:"What are the Three Threading Models?", a:"Many-to-One: many user threads mapped to one kernel thread. Simple, portable, but no true parallelism and one block blocks all. One-to-One: each user thread → one kernel thread. True parallelism, one block doesn't affect others. Overhead of creating kernel threads. Used by Linux, Windows. Many-to-Many: N user threads → M kernel threads (M≤N). Flexible, avoids both downsides. Complex to implement."},
      {q:"What are the Benefits of Threads (4 main ones)?", a:"1. Responsiveness: program remains responsive even if part is blocked (e.g., web browser loads page while still accepting clicks). 2. Resource Sharing: threads share process memory, no need for IPC. 3. Economy: creating/switching threads much cheaper than processes. 4. Scalability: threads can run in parallel on multiple cores, improving performance for CPU-bound tasks."},
      {q:"What is the Program Counter in context of threads?", a:"Each thread has its own program counter (PC) that tracks where that specific thread is executing in the code. Since threads can be at different points in the same (or different) functions, each needs its own PC. This is stored per-thread in the thread's context alongside its register set."},
      {q:"What is a Thread Pool?", a:"Create a fixed number of threads at startup, waiting for work. When a task arrives, assign it to an idle thread. Benefits: no overhead of creating/destroying threads per task, limits total thread count (prevents resource exhaustion), can be tuned to match hardware cores. Used in web servers, database connection pools."},
    ],

    id:5, title:"Chapter 5", subtitle:"CPU Scheduling", color:"#a55eea",
    topics:[
      {q:"What are the CPU Scheduling Criteria?", a:"CPU Utilization: keep CPU as busy as possible (100% ideal). Throughput: number of processes completed per time unit. Turnaround Time: total time from submission to completion. Waiting Time: total time spent in ready queue. Response Time: time from request to first response (important for interactive systems). Minimize turnaround, waiting, response. Maximize utilization, throughput."},
      {q:"What is FCFS Scheduling? What is the Convoy Effect?", a:"First-Come First-Served: non-preemptive, processes run in arrival order. Simple to implement (FIFO queue). Convoy Effect: one long CPU-bound process holds CPU while short I/O-bound processes queue up. Average waiting time can be very high. Example: processes with burst times 24, 3, 3 → avg wait = (0+24+27)/3 = 17ms if 24 arrives first, but only 3ms if short jobs go first."},
      {q:"What is SJF Scheduling? Preemptive vs Non-preemptive?", a:"Shortest Job First: schedules process with shortest next CPU burst. Provably optimal (minimizes average waiting time). Problem: can't know future burst length — estimated via exponential averaging: τ(n+1) = α·t(n) + (1-α)·τ(n). Non-preemptive SJF: once started, runs to completion. Preemptive SJF (SRTF - Shortest Remaining Time First): if new process arrives with shorter remaining time, preempt current process."},
      {q:"What is Priority Scheduling? What are Starvation and Aging?", a:"Each process has a priority (integer). CPU given to highest priority. Can be preemptive or non-preemptive. Internal priorities: time limits, memory, I/O vs CPU. External: importance set by user. Problem: Starvation — low priority processes may wait indefinitely. Solution: Aging — periodically increase priority of waiting processes (e.g., every 15 minutes, increment priority). Eventually even low-priority process gets CPU."},
      {q:"What is Round Robin (RR) Scheduling?", a:"Each process gets a time quantum q (typically 10-100ms). After quantum, process preempted and added to end of ready queue. Fair, designed for time-sharing. Performance: if q large → FCFS. If q small → high context switch overhead. Rule of thumb: 80% of CPU bursts should be shorter than q. Average waiting time can be high but response time is good."},
      {q:"What is Multilevel Queue? What is Multilevel Feedback Queue?", a:"MLQ: ready queue split into multiple queues (e.g., foreground/interactive, background/batch). Each queue has its own scheduling algorithm. Multilevel Feedback Queue allows processes to move between queues based on behavior. CPU-bound processes migrate to lower-priority queues; I/O-bound stay high. Most flexible, used in practice (Linux CFS is inspired by this)."},
      {q:"What is Multiple-Processor Scheduling? Push vs Pull Migration?", a:"Asymmetric: one master processor handles all scheduling decisions. Symmetric (SMP): each processor is self-scheduling, has its own ready queue or uses shared queue. Processor Affinity: process prefers to run on same CPU (warm cache). Push migration: a task periodically checks load across processors and pushes tasks from overloaded ones. Pull migration: idle processor pulls a task from a busy processor's queue."},
      {q:"What is Earliest Deadline First (EDF) Scheduling?", a:"Dynamic priority: process with earliest absolute deadline runs next. Priority changes as deadlines approach. Optimal for uniprocessor: if any scheduling can meet all deadlines, EDF can. Works for both periodic and aperiodic tasks. CPU utilization can reach 100% (unlike Rate Monotonic which caps at ~69%). Requires knowing deadlines at arrival."},
      {q:"What is the difference between preemptive and non-preemptive scheduling?", a:"Non-preemptive: once CPU is given to a process, it runs until it terminates or voluntarily yields (I/O request, wait). Simpler, no mid-instruction interruption. Preemptive: OS can forcibly take CPU from a running process (e.g., timer interrupt, higher priority arrival). Better for interactive systems and real-time. Requires careful handling of shared data (kernel data structures must be protected with locks)."},
    ],

    topics:[
      {q:"What is a Race Condition?", a:"When multiple processes/threads access and manipulate shared data concurrently, and the final value depends on the order of execution. Example: two threads both do count++ (read-modify-write). If interleaved, one increment can be lost. Result is non-deterministic. Prevented by ensuring mutual exclusion during critical sections."},
      {q:"What is the Critical Section Problem?", a:"Each process has a critical section (code accessing shared data). Need protocol where: Entry section requests permission to enter CS, exit section signals leaving. Problem: design entry/exit code satisfying 3 requirements. Critical section must execute as atomic operation from perspective of other processes."},
      {q:"What are the 3 Requirements for CS Solutions?", a:"1. Mutual Exclusion: if process Pi is in CS, no other process can be in CS. 2. Progress: if no process is in CS and some want to enter, only those not in remainder section participate in deciding who enters, and decision cannot be postponed indefinitely. 3. Bounded Waiting: there exists a bound on number of times other processes can enter CS after a process requests entry (no starvation)."},
      {q:"What is Peterson's Solution?", a:"Two-process solution using shared: int turn and bool flag[2]. To enter CS: flag[i]=true; turn=j; while(flag[j] && turn==j); // busy wait. Exit: flag[i]=false. Proof: satisfies all 3 requirements. Limitation: only works for 2 processes. Modern hardware may reorder instructions — need memory barriers to guarantee correctness on modern CPUs."},
      {q:"What are Mutex Locks?", a:"Simplest synchronization tool. acquire() sets lock to unavailable (busy-waits if already locked), release() sets lock back to available. acquire() and release() must be atomic (implemented with hardware atomic instructions like test-and-set or compare-and-swap). Spinlock: process busy-waits (spinning) — wastes CPU but no context switch overhead. Good for short CS on multicore systems."},
      {q:"What is a Semaphore? Binary vs Counting?", a:"Integer variable S. wait(S): if S≤0, block; else S--. signal(S): S++, wake a waiting process if any. Binary semaphore (mutex): S ∈ {0,1}, equivalent to mutex lock. Counting semaphore: S = number of available resources. Advantage over mutex: can solve more complex synchronization (ordering, resource counting). Must avoid busy waiting — use a waiting queue instead."},
      {q:"What are Classic Semaphore Problems?", a:"Ordering: Process B must execute after A: S=0; A executes, then signal(S); B: wait(S), then execute. Resource counting: 5 database connections: S=5; each user: wait(S) to get connection, signal(S) to release. Mutual exclusion: S=1 (binary semaphore). Semaphores can suffer from deadlock if processes do wait() calls in wrong order."},
      {q:"What is a Monitor?", a:"High-level ADT for synchronization. Programmer defines shared variables, procedures, and initialization. Only one process can be active inside monitor at a time (mutual exclusion enforced automatically). Condition variables: wait() — suspends calling process, releases monitor lock; signal() — wakes one waiting process. Easier to use correctly than semaphores. Implemented in Java (synchronized keyword, wait(), notifyAll())."},
      {q:"What is Priority Inversion? How is it solved?", a:"High-priority task H waits for low-priority task L to release a lock. Medium-priority task M (no lock needed) preempts L, causing H to wait as long as M runs — priority is inverted. Solution: Priority Inheritance — L temporarily inherits H's priority while holding the lock, preventing M from preempting L. Used in real-time OS. Famous example: Mars Pathfinder mission had this bug."},
    ],

      {q:"What is the Bounded-Buffer Problem?", a:"Producer creates items, puts in buffer (size N). Consumer takes items. Shared: mutex (=1), full (=0), empty (=N). Producer: wait(empty); wait(mutex); add item; signal(mutex); signal(full). Consumer: wait(full); wait(mutex); remove item; signal(mutex); signal(empty). Order matters: wait(empty/full) before wait(mutex) to avoid deadlock."},
      {q:"What is the Readers-Writers Problem?", a:"Multiple readers can read simultaneously (safe). Writers need exclusive access (no readers or other writers). First RW problem: no reader kept waiting unless writer has lock (writer may starve). Second RW problem: once writer ready, no new reader starts (reader may starve). Solution uses semaphores: rw_mutex (writer's mutex), mutex (protects read_count), read_count variable."},
      {q:"What is the Dining Philosophers Problem? (VVI)", a:"5 philosophers at round table, 5 forks between them. Eat: need both adjacent forks. Think: put down both. Naive solution → deadlock (all pick left fork). Solutions: Allow max 4 philosophers at table simultaneously. Pick up both forks atomically (mutex). Odd philosophers pick left first, even pick right first. Use a waiter (monitor) who grants permission. The VVI marker means this is likely a key exam question!"},
      {q:"What can go wrong in Dining Philosophers if done naively?", a:"All 5 philosophers pick up their left fork simultaneously. Now each waits for right fork, held by neighbor. Circular wait → deadlock. All 5 starve. This illustrates that even symmetric solutions can fail. The problem demonstrates challenges of resource allocation without global knowledge or coordination."},
      {q:"How does a Monitor solution fix Dining Philosophers?", a:"Define states: THINKING, HUNGRY, EATING. A philosopher can eat only if both neighbors are not eating. test(i) function checks: if I'm HUNGRY and both neighbors not EATING → set EATING, signal self[i]. pickup(i): set HUNGRY, test, if can't eat wait on self[i]. putdown(i): set THINKING, test both neighbors (they might now be able to eat)."},

    topics:[
      {q:"What are the 4 Necessary Conditions for Deadlock?", a:"1. Mutual Exclusion: at least one resource held in non-sharable mode. 2. Hold and Wait: a process holds at least one resource AND is waiting to acquire additional resources held by others. 3. No Preemption: resources can only be released voluntarily by the holding process. 4. Circular Wait: P1 waits for P2, P2 waits for P3, ..., Pn waits for P1. ALL FOUR must hold simultaneously."},
      {q:"What is a Resource Allocation Graph (RAG)?", a:"Directed graph to represent resource allocation state. Circles = processes. Squares = resource types (dots inside = instances). Assignment edge: resource → process (process holds it). Request edge: process → resource (process wants it). If graph has no cycle → no deadlock. If cycle exists and each resource has only one instance → deadlock. Multiple instances + cycle → possible deadlock (need Banker's algorithm to check)."},
      {q:"What are the 4 Ways to Handle Deadlock?", a:"1. Prevention: ensure at least one of the 4 conditions can never hold. 2. Avoidance: use extra information (max claim) to avoid entering unsafe states. 3. Detection and Recovery: allow deadlock to occur, periodically detect it, recover. 4. Ignorance (Ostrich Algorithm): pretend deadlock can't happen. Used by most commercial OS (Windows, Linux) — deadlock is rare, and detection overhead isn't worth it. Just reboot or kill process."},
      {q:"What is Deadlock Prevention?", a:"Attack each condition: Mutual Exclusion: make resources sharable (not always possible). Hold and Wait: request all resources at once before starting (low utilization), or release all before requesting more. No Preemption: if waiting for resource, release held resources. Circular Wait: impose total ordering on resource types; always request in increasing order. Circular wait prevention is most practical."},
      {q:"What is Deadlock Avoidance? What is a Safe State?", a:"Requires processes to declare max resource needs upfront. Safe state: a sequence P1, P2, ..., Pn exists where each Pi can get needed resources from available + resources held by processes before Pi. If in safe state → no deadlock. OS only grants requests that keep system in safe state. Unsafe state doesn't guarantee deadlock, but risk exists. Banker's Algorithm determines if state is safe."},
      {q:"How does Banker's Algorithm work?", a:"When process requests resources: 1. If request ≤ need and request ≤ available, tentatively allocate. 2. Run Safety Algorithm: find a process whose needs can be met with currently available resources, simulate its completion, add its resources to available, repeat. If all processes finish → safe → grant request. Else → unsafe → deny request (process waits). O(n²·m) where n=processes, m=resource types."},
      {q:"What is Deadlock Detection?", a:"Allow deadlock to occur. Single instance resources: use wait-for graph (simplified RAG, only processes). Cycle in wait-for graph → deadlock. Multiple instances: use algorithm similar to Banker's to find processes that can finish. Run periodically (tradeoff: frequent = overhead, infrequent = more resources stuck longer). Triggered when CPU utilization drops."},
      {q:"What is Recovery from Deadlock?", a:"Process Termination: kill all deadlocked processes (simple but expensive), or kill one at a time until cycle broken (costly). Resource Preemption: select victim (minimize cost — lowest priority, least CPU used, least resources held), preempt its resources. Rollback: victim returns to safe state (needs checkpointing). Risk: starvation (same process always victim) — use count of how many times preempted."},
    ],

    topics:[
      {q:"What is the role of Memory Management in OS?", a:"Keeps track of which memory parts are in use and by whom. Decides which processes (or parts) to move in/out of memory. Allocates and deallocates memory space. Translates logical addresses (what program uses) to physical addresses (actual RAM location) via hardware MMU (Memory Management Unit)."},
      {q:"What is Logical vs Physical Address Space?", a:"Logical (virtual) address: generated by CPU, what program 'sees' (starts at 0). Physical address: actual address in memory hardware. MMU (Memory Management Unit) translates logical→physical at runtime using a relocation register (base register). Logical address + base register = physical address. Provides memory protection and relocation."},
      {q:"What is Swapping?", a:"Moving an entire process from main memory to backing store (disk) and back. Allows more processes than fit in RAM. Roll out, roll in (for priority-based scheduling). Context switch time increases dramatically with swapping (transfer time proportional to process size). Modern systems use paging instead. Mobile OS typically don't swap — instead terminate apps."},
      {q:"What is Swapping on Mobile Systems?", a:"iOS/Android generally don't support traditional swapping because: Flash memory has limited write cycles, flash I/O slower relative to RAM, mobile apps designed to be killed and restarted. Instead: iOS asks apps to voluntarily relinquish memory. Android terminates processes (LRU order) when memory needed. App state saved to flash for quick restart."},
      {q:"What is Contiguous Allocation?", a:"Each process stored in one contiguous block of memory. Base register: start of process's memory. Limit register: size. MMU checks: base ≤ address < base+limit. Two approaches: Fixed partitions (memory divided into fixed chunks — internal fragmentation, unused space within partition). Variable partitions (partitions sized to process — external fragmentation, small holes between processes)."},
      {q:"What is External vs Internal Fragmentation?", a:"Internal fragmentation: allocated block larger than needed; wasted space is INSIDE the allocation. Occurs with fixed-size partitions and paging (last page may not be full). External fragmentation: free memory exists but not contiguous; total free space sufficient but spread in small chunks. Occurs with variable partitions. Solution: Compaction (shuffle processes together) — expensive."},
      {q:"What are Multi-Partition Allocation strategies?", a:"First Fit: allocate the FIRST hole big enough (fast, tends to leave large holes at end). Best Fit: allocate the SMALLEST hole that fits (least waste per allocation, but leaves tiny useless holes, slower). Worst Fit: allocate the LARGEST hole (leaves large leftover hole — better for future, but no benefit in practice). First fit and best fit better than worst fit."},
      {q:"What is Thrashing?", a:"A process keeps paging: spending more time handling page faults than executing instructions. Cause: process doesn't have enough frames for its working set. CPU scheduler sees low utilization, loads more processes → even less frames per process → more faults → CPU utilization collapses. Solution: Working Set Model — give each process frames for its current working set (set of pages used recently)."},
    ],

  {
    id:10, title:"Chapter 10", subtitle:"Virtual Memory", color:"#fa8231",
    topics:[
      {q:"What is Virtual Memory? Why is it useful?", a:"Virtual memory allows processes to use more memory than physically available, by storing part of the address space on disk. Benefits: programs larger than physical memory can run, more processes fit in memory (only active parts loaded), efficient process creation (Copy-on-Write). Implemented via demand paging: load pages only when accessed."},
      {q:"What happens when a page is not in main memory? (Page Table entry)", a:"Each page table entry has a valid-invalid bit. Valid (1): page is in physical memory, frame number is valid. Invalid (0): page is either not used by process, or used but currently on disk. Accessing an invalid page triggers a page fault trap. The OS then handles loading that page from disk."},
      {q:"What is a Page Fault? Walk through the steps.", a:"1. Process accesses a page (PTE valid bit = 0) → trap to OS. 2. OS checks internal table: is this a valid access? If not → terminate (segfault). 3. Find a free frame. 4. Schedule disk read of page into frame. 5. Update page table: set frame number, set valid bit = 1. 6. Restart the faulting instruction (from scratch). Page fault rate affects performance: EAT = (1-p)×memory access + p×(page fault overhead)."},
      {q:"What is Copy-on-Write (COW)?", a:"After fork(), parent and child initially share all pages, marked copy-on-write. When either process writes to a shared page, OS creates a copy of that page for the writing process, and both now have separate copies. Efficient: if child immediately calls exec(), no unnecessary copying. Only pages actually written get copied. vfork() variant doesn't copy at all — child must immediately exec()."},
      {q:"What happens when there is no free frame?", a:"Page replacement is needed. Steps: 1. Find location of desired page on disk. 2. Find a free frame OR select a victim frame using replacement algorithm. 3. If victim frame is dirty (modified bit = 1), write it to disk first. 4. Read desired page into the (now free) frame. 5. Update both page tables (victim now invalid, new page valid). 6. Restart process. Dirty bit reduces I/O by avoiding writes of unmodified pages."},
      {q:"What is the Dirty Bit (Modified Bit)?", a:"1-bit flag in each page table entry. Set to 1 when the page is written to. When replacing a page: if dirty=0, just overwrite the frame (page on disk is still current copy). If dirty=1, must write frame back to disk first, THEN load new page. This halves I/O for unmodified pages. Critical optimization for performance."},
      {q:"What is FIFO Page Replacement? What is Belady's Anomaly?", a:"FIFO: maintain a queue of pages in memory; replace the page that has been in memory longest. Simple but ignores actual usage — a heavily used old page gets evicted. Belady's Anomaly: for some reference strings, increasing the number of frames can INCREASE page faults with FIFO. Counterintuitive. Most other algorithms (LRU, Optimal) do not suffer from this."},
      {q:"What is Optimal Page Replacement?", a:"Replace the page that will NOT be used for the longest time in the future. Provably optimal — lowest page fault rate possible. Problem: requires knowing future reference string (impossible in practice). Used as benchmark to compare other algorithms. If your algorithm performs close to optimal, it's good."},
      {q:"What is LRU Page Replacement?", a:"Least Recently Used: replace the page that has not been used for the longest time in the PAST (approximates optimal using past as predictor of future). No Belady's anomaly. Implementation: Counters (timestamp each page access, replace smallest), Stack (move accessed page to top, replace bottom) — both require hardware support. Good performance but overhead."},
      {q:"What is the Clock (Second Chance) Algorithm?", a:"Approximation of LRU. Each frame has a reference bit (set to 1 on access). Clock hand sweeps frames circularly. If reference bit = 1: clear it to 0, advance (give second chance). If reference bit = 0: evict this page. Pages recently used get a second chance before eviction. More efficient than true LRU — no per-access overhead, just a bit."},

      {q:"What is Allocation of Frames? How many does each process get?", a:"Minimum frames: must have enough for any single instruction to complete (instruction may reference multiple pages). Maximum frames: total available frames. Strategies: Equal allocation (n frames / n processes). Proportional allocation: process gets frames proportional to its size. Priority allocation: higher priority process gets more frames."},
      {q:"What is Fixed vs Global vs Local Allocation?", a:"Fixed allocation: process given fixed number of frames, cannot take from others. Local replacement: process replaces only its own pages (performance isolated). Global replacement: process can take frames from any other process. Global generally gives better throughput (high-priority process can grow); local is more predictable (one process's bad behavior doesn't hurt others)."},
      {q:"What is Page Fault Frequency (PFF) control?", a:"Instead of working set, monitor page fault rate per process directly. Set upper and lower bounds. If fault rate > upper bound → process needs more frames (give it one). If fault rate < lower bound → process has too many frames (take one away). Suspends process if no free frames available. Directly controls thrashing without working set computation."},
      {q:"What is the Buddy System?", a:"Kernel memory allocator. Memory divided in powers of 2. To allocate N bytes: find smallest power of 2 ≥ N. If only larger block available, split it in two equal 'buddies.' Repeat until right size. To free: check if buddy is free → merge (coalesce) them back. Fast coalescing due to simple buddy address calculation. Limitation: internal fragmentation (must round up to power of 2)."},
      {q:"What is Slab Allocation?", a:"Kernel allocator for fixed-size objects (e.g., PCB, inode, file struct). A cache holds slabs (one or more contiguous pages). Each slab divided into fixed-size slots for one object type. States: full, partial, empty. Allocation from partial slab first, then empty slab. Benefits: no fragmentation for that object type, fast (objects pre-initialized), good cache color usage. Used in Linux kernel."},
      {q:"What is the Moving-Head Disk Mechanism?", a:"HDD: spinning platters coated with magnetic material. Read/write head on actuator arm moves across tracks. Access time = Seek time (arm movement to correct track, 3-15ms) + Rotational Latency (wait for sector to spin under head, 0-8ms at 7200RPM) + Transfer time (actual data transfer, fastest). Seek time dominates → minimize arm movement."},
      {q:"What is HDD vs SSD?", a:"HDD: mechanical movement, 5-15ms access, high capacity, cheap/GB, susceptible to shock, fragmentation matters. SSD: no moving parts, ~0.1ms access, faster random I/O, expensive/GB, limited write cycles (wear leveling needed), not affected by fragmentation. For OS: SSDs used for boot/system, HDDs for bulk storage. SSDs increasingly dominant."},
      {q:"What is a Storage Area Network (SAN)?", a:"High-speed, dedicated network (typically Fibre Channel or iSCSI) connecting servers to shared storage arrays. Multiple servers access same storage pool. Appears as local storage to each server. Benefits: centralized management, easy capacity scaling, storage not tied to a single server. Used in data centers, enterprise environments."},
      {q:"What are FCFS and SSTF Disk Scheduling?", a:"FCFS: service requests in arrival order. Simple, fair, but poor performance (lots of seeking back and forth). SSTF (Shortest Seek Time First): move to nearest pending request next. Reduces seek time significantly vs FCFS but can cause starvation of requests far from current head position. Like SJF for disk — greedy, not optimal globally."},
      {q:"What are SCAN, C-SCAN, LOOK, C-LOOK?", a:"SCAN (elevator): head moves in one direction servicing requests, reaches end, reverses. Fair, no starvation. Bias toward middle tracks. C-SCAN (Circular): like SCAN but only services requests in one direction; jumps back to start without servicing. More uniform wait time. LOOK: like SCAN but only goes as far as last request (doesn't go to disk edge). C-LOOK: like C-SCAN but jumps back to first request. LOOK/C-LOOK are practical improvements."},
      {q:"What is RAID? Explain key levels.", a:"Redundant Array of Independent Disks. RAID 0: striping only (split data across disks), best performance, no redundancy, one disk fails = all data lost. RAID 1: mirroring (copy on 2 disks), can survive one disk failure, 50% capacity. RAID 4: striping + dedicated parity disk (bottleneck). RAID 5: striping + distributed parity (most common), survives one disk failure. RAID 6: double parity (survives two failures). RAID 10: stripe of mirrors."},
      {q:"What is Striping?", a:"Splitting data across multiple disks so that a single read/write can use multiple disks in parallel. Bit-level striping: bits of one byte on different disks (rarely used). Block-level striping: blocks of a file spread across disks (most common). Increases throughput proportionally to number of disks. No redundancy — adds performance not reliability. Combined with parity for RAID protection."},

    topics:[
      {q:"Explain the I/O Structure", a:"Devices connect to CPU/memory via buses (PCIe, USB, etc.). Device controller: hardware component that operates the device. CPU communicates with controller via: Port I/O (special I/O instructions, separate I/O address space) or Memory-Mapped I/O (controller registers mapped to memory addresses, accessed with normal load/store). Three I/O methods: Polling, Interrupt-driven, DMA."},
      {q:"What is a Device Controller?", a:"Hardware that acts as interface between device and system bus. Has: data registers (hold data to/from device), status registers (is device busy? error? done?), control registers (tell device what to do). CPU reads/writes these registers to control device. Controller has local buffer storage. When data transfer complete, controller raises interrupt to notify CPU."},
      {q:"What is a Bus? What is a Port? What is Daisy Chaining?", a:"Port: a single connection point for one device (e.g., USB port, serial port). Bus: shared communication channel; multiple devices connect to same wires (PCIe, USB bus, SATA). Daisy Chaining: devices connected in series — device A connected to device B connected to controller. Interrupt request propagates down chain; first device that asserts interrupt has highest priority. PCI originally used this."},
      {q:"What is Polling (Busy-Wait I/O)?", a:"CPU repeatedly reads device's status register in a loop (busy-waits) until device signals completion (ready bit set). Simple to implement. Problem: wastes CPU cycles — CPU is spinning doing nothing useful. When good: if device is very fast (the wait is short), or on embedded systems where CPU has nothing better to do. Modern CPUs do 'spinning' polls for short expected waits before falling back to interrupts."},
      {q:"What is Interrupt-Driven I/O?", a:"1. CPU initiates I/O (writes to controller registers). 2. CPU continues executing other processes. 3. Device completes operation → raises interrupt signal on interrupt request line. 4. CPU completes current instruction, checks interrupt line. 5. CPU saves state, jumps to Interrupt Service Routine (ISR) via interrupt vector. 6. ISR handles event (e.g., copies data from controller buffer to memory). 7. CPU restores state and resumes. Much more efficient than polling for slow devices."},
      {q:"Polling vs Interrupt: which is better when?", a:"Polling: better when device is fast and expected wait is very short (e.g., high-speed network NIC processing packets — interrupt overhead per packet would dominate). Interrupts: better when device is slow and CPU should do other work (keyboard, disk, user I/O). Modern hybrid: poll first for short time, if not ready switch to interrupt mode. High-performance network drivers use polling loops (NAPI in Linux)."},
      {q:"What is DMA (Direct Memory Access)?", a:"DMA controller handles bulk data transfers between I/O device and memory WITHOUT CPU involvement. Setup: CPU tells DMA (source address, destination in memory, byte count, direction). DMA takes over bus, transfers data directly, stealing bus cycles from CPU (cycle stealing). When done, DMA raises ONE interrupt. CPU only interrupted once per block transfer instead of once per byte. Critical for disk, network, audio."},
      {q:"What is Buffering? Why is it needed?", a:"Temporary memory area holding data during transfer. Needed for: 1. Speed mismatch (producer faster than consumer — buffer prevents data loss). 2. Transfer size mismatch (device and application use different data sizes). 3. Copy semantics (user calls write() and modifies buffer — OS copied data to kernel buffer first, so modification doesn't affect already-queued data). Double buffering: two buffers so one can be filled while other is drained."},
      {q:"Buffering vs Caching vs Spooling?", a:"Buffering: temporary storage to TRANSFER data (handles speed/size mismatch). Caching: copy kept in fast storage for REUSE (same data available faster next time — data exists elsewhere). Spooling (Simultaneous Peripheral Operations On-Line): buffer an entire job before sending to dedicated device that can't interleave jobs (printer). Jobs queued on disk, sent to printer one at a time. Print queue is a spooler."},
      {q:"What Characteristics Define I/O Devices?", a:"Transfer mode: character device (one byte at a time — keyboard, serial) vs block device (fixed-size blocks — disk, SSD). Access method: sequential (tape) vs random-access (disk, SSD). Synchronicity: synchronous (predictable response time) vs asynchronous (variable). Sharing: dedicated (printer — one process at a time) vs sharable (keyboard, disk). Speed: varies from bytes/sec to GB/sec. Direction: read-only, write-only, read-write."},

// Seeded shuffle — stable per question index so answers don't move on re-render
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed >>> 0;
  for (let i = a.length - 1; i > 0; i--) {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledMcqs(mcqs, chapterId) {
  return mcqs.map((mcq, qi) => {
    const pairs = mcq.opts.map((opt, i) => ({ opt, correct: i === mcq.ans }));
    const shuffled = seededShuffle(pairs, chapterId * 1000 + qi * 37 + 7);
    return { q: mcq.q, opts: shuffled.map(x => x.opt), ans: shuffled.findIndex(x => x.correct) };
  });
}

                <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:2}}>{c.title}</div>
                <div style={{fontSize:11,color:T.textSub,marginBottom:10}}>{c.subtitle}</div>
                <div style={{fontSize:10,color:T.textMuted,marginBottom:8}}>{c.topics.length} flashcards · {c.mcqs.length} MCQs</div>
                <div style={{background:T.borderLight,borderRadius:4,height:4,overflow:"hidden"}}>
                  <div style={{background:c.color,width:`${pct}%`,height:"100%",borderRadius:4,transition:"width .4s"}}/>
                </div>
                <div style={{fontSize:10,color:T.textMuted,marginTop:5}}>{known}/{c.topics.length} known</div>
              </button>
            );
          })}
        </div>
      )}
      <div style={{textAlign:"center",marginTop:40}}>
        <button onClick={()=>{ setScores({}); try{localStorage.removeItem("os_scores")}catch{}; }}
          style={{background:"none",border:`1px solid ${T.border}`,borderRadius:8,color:T.textMuted,padding:"8px 20px",fontSize:11,fontFamily:"inherit"}}>
          Reset Progress
        </button>
      </div>
    </div>
  );

  // ── CHAPTER VIEW ─────────────────────────────────────────────────────────
  if(view==="chapter" && ch) return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"32px 16px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,flexWrap:"wrap"}}>
        <button onClick={()=>setView("home")}
          style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.textSub,padding:"8px 16px",fontSize:11,fontFamily:"inherit",boxShadow:T.shadow}}>
          ← Home
        </button>
        <div style={{flex:1}}>
          <div style={{fontSize:10,color:T.textMuted,letterSpacing:3,textTransform:"uppercase"}}>{ch.subtitle}</div>
          <h2 style={{margin:0,fontSize:22,color:T.text,fontWeight:800}}>{ch.title}</h2>
        </div>
      </div>

      <div style={{display:"flex",gap:10,marginBottom:24}}>
        <button onClick={()=>{setQuizIdx(0);setQuizRevealed(false);setUserAnswer("");setView("quiz");}}
          style={{background:ch.color,border:"none",borderRadius:8,color:"#fff",
            padding:"10px 18px",fontSize:12,fontWeight:700,fontFamily:"inherit",flex:1,boxShadow:`0 3px 12px ${ch.color}50`}}>
          📝 Flashcard Quiz
        </button>
        <button onClick={()=>startMcq(chId)}
          style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.text,
            padding:"10px 18px",fontSize:12,fontWeight:700,fontFamily:"inherit",flex:1,boxShadow:T.shadow}}>
          🔘 MCQ Quiz ({ch.mcqs.length} Qs)
        </button>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {ch.topics.map((t,i)=>{
          const key=`${chId}-${i}`; const isOpen=flipped[key]; const st=scores[key];
          return (
            <div key={i} onClick={()=>setFlipped(p=>({...p,[key]:!p[key]}))}
              style={{background:T.card,
                border:`1.5px solid ${st==="know"?"#20a060":st==="review"?"#e03050":isOpen?ch.color+"60":T.border}`,
                borderRadius:10,padding:"16px 20px",cursor:"pointer",transition:"all .15s",boxShadow:T.shadow}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
                <div style={{fontSize:13,fontWeight:600,color:T.text,lineHeight:1.6,flex:1}}>{t.q}</div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                  {st==="know" && <span style={{fontSize:11,color:"#20a060",fontWeight:700}}>✓</span>}
                  {st==="review" && <span style={{fontSize:11,color:"#e03050"}}>↻</span>}
                  <span style={{color:T.textMuted,fontSize:12}}>{isOpen?"▲":"▼"}</span>
                </div>
              </div>
              {isOpen && (
                <>
                  <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${T.borderLight}`,
                    fontSize:13,color:"#444",lineHeight:1.9,borderLeft:`3px solid ${ch.color}`,paddingLeft:12}}>
                    {t.a}
                  </div>
                  <div style={{display:"flex",gap:8,marginTop:14}} onClick={e=>e.stopPropagation()}>
                    <button onClick={()=>saveScore(key,"know")} style={{background:"#e8f8ef",border:"1px solid #20a060",borderRadius:6,color:"#20a060",padding:"6px 14px",fontSize:11,fontFamily:"inherit",cursor:"pointer",fontWeight:600}}>✓ Know it</button>
                    <button onClick={()=>saveScore(key,"review")} style={{background:"#fdeef0",border:"1px solid #e03050",borderRadius:6,color:"#e03050",padding:"6px 14px",fontSize:11,fontFamily:"inherit",cursor:"pointer",fontWeight:600}}>↻ Review</button>
                    <button onClick={()=>saveScore(key,undefined)} style={{background:"none",border:`1px solid ${T.border}`,borderRadius:6,color:T.textMuted,padding:"6px 14px",fontSize:11,fontFamily:"inherit",cursor:"pointer"}}>Clear</button>
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── FLASHCARD QUIZ ───────────────────────────────────────────────────────
  if(view==="quiz" && ch) {
    if(quizTopics.length===0) return (
      <div style={{maxWidth:500,margin:"80px auto",textAlign:"center",padding:24}}>
        <div style={{fontSize:48,marginBottom:16}}>🎉</div>
        <div style={{fontSize:22,color:T.text,fontWeight:700}}>Chapter Complete!</div>
        <div style={{color:T.textSub,marginTop:8,marginBottom:32,fontSize:13}}>All topics marked as known for {ch.title}.</div>
        <button onClick={()=>{setView("chapter");setQuizIdx(0);setUserAnswer("");}}
          style={{background:ch.color,border:"none",borderRadius:8,color:"#fff",padding:"12px 28px",fontSize:13,fontFamily:"inherit",fontWeight:700,cursor:"pointer"}}>
          Back to Chapter
        </button>
      </div>
    );

    const topic = quizTopics[quizIdx];
    return (
      <div style={{maxWidth:640,margin:"0 auto",padding:"36px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
          <button onClick={()=>{setView("chapter");setQuizIdx(0);setQuizRevealed(false);setUserAnswer("");}}
            style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.textSub,padding:"8px 14px",fontSize:11,fontFamily:"inherit",boxShadow:T.shadow}}>
            ← Exit
          </button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:12,color:T.textSub}}>{quizIdx+1} / {quizTopics.length}</div>
            <div style={{width:120,background:T.borderLight,borderRadius:4,height:4,marginTop:4}}>
              <div style={{background:ch.color,width:`${Math.round(quizIdx/quizTopics.length*100)}%`,height:"100%",borderRadius:4}}/>
            </div>
          </div>
          <div style={{fontSize:11,color:T.textMuted}}>📝 Flashcard</div>
        </div>

        <div style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:16,padding:"32px 28px",boxShadow:T.shadowMd}}>
          <div style={{fontSize:10,color:ch.color,letterSpacing:3,textTransform:"uppercase",marginBottom:14,fontWeight:700}}>{ch.subtitle}</div>
          <div style={{fontSize:17,fontWeight:700,color:T.text,lineHeight:1.7,marginBottom:24}}>{topic.q}</div>

          <div style={{marginBottom:20}}>
            <div style={{fontSize:10,color:T.textMuted,letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Your Answer</div>
            <textarea value={userAnswer} onChange={e=>setUserAnswer(e.target.value)}
              placeholder="Type your answer here before revealing..."
              disabled={quizRevealed} rows={5}
              style={{width:"100%",background:quizRevealed?T.cardAlt:T.card,
                border:`1.5px solid ${quizRevealed?T.borderLight:T.border}`,
                borderRadius:10,padding:"14px 16px",color:quizRevealed?T.textMuted:T.text,
                fontSize:13,lineHeight:1.8,resize:"vertical",outline:"none",fontFamily:"'Courier New',monospace"}}/>
          </div>

          {!quizRevealed ? (
            <button onClick={()=>setQuizRevealed(true)}
              style={{background:ch.color,border:"none",borderRadius:8,color:"#fff",
                padding:"12px 24px",fontSize:12,fontFamily:"inherit",fontWeight:700,cursor:"pointer",boxShadow:`0 3px 10px ${ch.color}50`}}>
              Reveal Answer ▼
            </button>
          ) : (
            <>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
                <div>
                  <div style={{fontSize:10,color:T.textMuted,letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Your Answer</div>
                  <div style={{background:T.cardAlt,borderRadius:10,padding:"14px",fontSize:13,color:"#666",
                    lineHeight:1.8,minHeight:80,borderLeft:"3px solid #ddd",whiteSpace:"pre-wrap"}}>
                    {userAnswer.trim()||<span style={{color:T.textMuted,fontStyle:"italic"}}>No answer written</span>}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:10,color:ch.color,letterSpacing:2,textTransform:"uppercase",marginBottom:8,fontWeight:700}}>Correct Answer</div>
                  <div style={{background:T.cardAlt,borderRadius:10,padding:"14px",fontSize:13,color:"#333",
                    lineHeight:1.8,minHeight:80,borderLeft:`3px solid ${ch.color}`}}>
                    {topic.a}
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:12}}>
                <button onClick={()=>markQuiz("review")}
                  style={{background:"#fdeef0",border:"1.5px solid #e03050",borderRadius:8,color:"#e03050",
                    padding:"12px 24px",fontSize:12,fontFamily:"inherit",fontWeight:700,flex:1,cursor:"pointer"}}>
                  ✗ Still Learning
                </button>
                <button onClick={()=>markQuiz("know")}
                  style={{background:"#e8f8ef",border:"1.5px solid #20a060",borderRadius:8,color:"#20a060",
                    padding:"12px 24px",fontSize:12,fontFamily:"inherit",fontWeight:700,flex:1,cursor:"pointer"}}>
                  ✓ Got It!
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  // ── MCQ QUIZ ─────────────────────────────────────────────────────────────
  if(view==="mcq" && ch) {
    if(mcqDone) {
      const pct = Math.round(mcqScore.correct/mcqScore.total*100);
      const grade = pct>=90?"🏆 Excellent!":pct>=75?"👍 Good Job!":pct>=60?"📚 Keep Studying":"💪 Review Needed";
      const scoreColor = pct>=75?"#20a060":"#e03050";
      return (
        <div style={{maxWidth:480,margin:"60px auto",textAlign:"center",padding:"24px 16px"}}>
          <div style={{fontSize:48,marginBottom:12}}>{pct>=75?"🎯":"📖"}</div>
          <div style={{fontSize:22,color:T.text,fontWeight:700,marginBottom:4}}>Quiz Complete</div>
          <div style={{fontSize:13,color:T.textSub,marginBottom:28}}>{ch.title} — MCQ Quiz</div>
          <div style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:16,padding:"32px",marginBottom:24,boxShadow:T.shadowMd}}>
            <div style={{fontSize:52,fontWeight:900,color:scoreColor,marginBottom:4}}>
              {mcqScore.correct}/{mcqScore.total}
            </div>
            <div style={{fontSize:28,fontWeight:700,color:T.text,marginBottom:8}}>{pct}%</div>
            <div style={{fontSize:14,color:T.textSub}}>{grade}</div>
            <div style={{margin:"20px auto 0",background:T.borderLight,borderRadius:8,height:8,maxWidth:200,overflow:"hidden"}}>
              <div style={{background:scoreColor,width:`${pct}%`,height:"100%",borderRadius:8}}/>
            </div>
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center"}}>
            <button onClick={()=>startMcq(chId)}
              style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.text,padding:"11px 22px",fontSize:12,fontFamily:"inherit",fontWeight:700,cursor:"pointer",boxShadow:T.shadow}}>
              Retry MCQ
            </button>
            <button onClick={()=>setView("chapter")}
              style={{background:ch.color,border:"none",borderRadius:8,color:"#fff",padding:"11px 22px",fontSize:12,fontFamily:"inherit",fontWeight:700,cursor:"pointer",boxShadow:`0 3px 10px ${ch.color}50`}}>
              Back to Chapter
            </button>
          </div>
        </div>
      );
    }

    const mcq = mcqData[mcqIdx];
    if(!mcq) return null;
    const optLetters = ["A","B","C","D"];

    return (
      <div style={{maxWidth:640,margin:"0 auto",padding:"36px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
          <button onClick={()=>setView("chapter")}
            style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.textSub,padding:"8px 14px",fontSize:11,fontFamily:"inherit",boxShadow:T.shadow}}>
            ← Exit
          </button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:12,color:T.textSub}}>{mcqIdx+1} / {mcqData.length}</div>
            <div style={{width:120,background:T.borderLight,borderRadius:4,height:4,marginTop:4}}>
              <div style={{background:ch.color,width:`${Math.round(mcqIdx/mcqData.length*100)}%`,height:"100%",borderRadius:4}}/>
            </div>
          </div>
          <div style={{fontSize:12,fontWeight:700,color:mcqScore.correct>0?"#20a060":T.textMuted}}>
            ✅ {mcqScore.correct}/{mcqScore.total}
          </div>
        </div>

        <div style={{background:T.card,border:`1.5px solid ${T.border}`,borderRadius:16,padding:"32px 28px",boxShadow:T.shadowMd}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <span style={{background:ch.color,color:"#fff",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,letterSpacing:1}}>
              MCQ
            </span>
            <span style={{fontSize:11,color:T.textMuted}}>{ch.subtitle}</span>
          </div>
          <div style={{fontSize:16,fontWeight:700,color:T.text,lineHeight:1.7,marginBottom:24}}>{mcq.q}</div>

          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {mcq.opts.map((opt,i)=>{
              const isCorrect = i===mcq.ans;
              const isSelected = i===mcqSelected;
              const revealed = mcqSelected!==null;
              let bg=T.card, border=T.border, color=T.text, letterBg="#f0eeea", letterColor=T.textSub;
              if(revealed){
                if(isCorrect){bg="#e8f8ef";border="#20a060";color="#15703f";letterBg="#20a060";letterColor="#fff";}
                else if(isSelected){bg="#fdeef0";border="#e03050";color="#b02040";letterBg="#e03050";letterColor="#fff";}
                else{color=T.textMuted;}
              } else {
                letterBg = ch.color+"22";
                letterColor = ch.color;
              }
              return (
                <button key={i} onClick={()=>handleMcqAnswer(i)} disabled={revealed}
                  style={{background:bg,border:`1.5px solid ${border}`,borderRadius:10,padding:"13px 16px",
                    textAlign:"left",color:color,fontSize:13,lineHeight:1.6,
                    cursor:revealed?"default":"pointer",transition:"all .12s",
                    display:"flex",alignItems:"flex-start",gap:12,
                    boxShadow:revealed?"none":T.shadow}}
                  onMouseEnter={e=>{ if(!revealed){ e.currentTarget.style.borderColor=ch.color; e.currentTarget.style.boxShadow=`0 2px 8px ${ch.color}30`; }}}
                  onMouseLeave={e=>{ if(!revealed){ e.currentTarget.style.borderColor=T.border; e.currentTarget.style.boxShadow=T.shadow; }}}>
                  <span style={{background:letterBg,color:letterColor,fontWeight:700,fontSize:11,
                    width:22,height:22,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0,marginTop:1}}>
                    {revealed&&isCorrect?"✓":revealed&&isSelected?"✗":optLetters[i]}
                  </span>
                  <span>{opt}</span>
                </button>
              );
            })}
          </div>

          {mcqSelected!==null && (
            <div style={{marginTop:20,paddingTop:20,borderTop:`1px solid ${T.borderLight}`,display:"flex",justifyContent:"flex-end"}}>
              <button onClick={nextMcq}
                style={{background:ch.color,border:"none",borderRadius:8,color:"#fff",padding:"11px 28px",
                  fontSize:13,fontFamily:"inherit",fontWeight:700,cursor:"pointer",boxShadow:`0 3px 10px ${ch.color}50`}}>
                {mcqIdx+1<mcqData.length?"Next Question →":"See Results 🏁"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return null;
}

function SearchCard({t, scores, saveScore}) {
  const [open, setOpen] = useState(false);
  const key=`${t.chId}-${t.idx}`; const st=scores[key];
  return (
    <div onClick={()=>setOpen(o=>!o)}
      style={{background:"#fff",border:`1.5px solid ${st==="know"?"#20a060":st==="review"?"#e03050":"#e5e2dc"}`,
        borderRadius:10,padding:"14px 18px",marginBottom:8,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <div style={{width:6,height:6,borderRadius:"50%",background:t.chColor,flexShrink:0}}/>
        <div style={{fontSize:10,color:"#999"}}>{t.chTitle}</div>
      </div>
      <div style={{fontSize:13,fontWeight:600,color:"#1a1820",lineHeight:1.5}}>{t.q}</div>
      {open && (
        <>
          <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #eeece8",fontSize:13,color:"#555",lineHeight:1.9,
            borderLeft:`3px solid ${t.chColor}`,paddingLeft:12}}>{t.a}</div>
          <div style={{display:"flex",gap:8,marginTop:12}} onClick={e=>e.stopPropagation()}>
            <button onClick={()=>saveScore(key,"know")} style={{background:"#e8f8ef",border:"1px solid #20a060",borderRadius:6,color:"#20a060",padding:"6px 14px",fontSize:11,fontFamily:"inherit",cursor:"pointer",fontWeight:600}}>✓ Know it</button>
            <button onClick={()=>saveScore(key,"review")} style={{background:"#fdeef0",border:"1px solid #e03050",borderRadius:6,color:"#e03050",padding:"6px 14px",fontSize:11,fontFamily:"inherit",cursor:"pointer",fontWeight:600}}>↻ Review</button>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
